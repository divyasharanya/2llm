version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - rm -f .env.production
        - printenv | grep -E '^(AUTH_|GOOGLE_|APP_AWS_|DYNAMODB_|ADMIN_|NEXT_PUBLIC_)' > .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  build:
    environment:
      NODE_VERSION: 18